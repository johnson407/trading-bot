services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: app
    image: trading-bot-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-trading_bot}
      DB_USERNAME: ${DB_USERNAME:-trading_bot}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      TRADING_LIVE_ENABLED: ${TRADING_LIVE_ENABLED:-false}
      ENGINE_PLAN_URL: http://engine:8080
      ENGINE_INTERNAL_TOKEN: ${ENGINE_INTERNAL_TOKEN:-}
      APP_PREVIOUS_KEYS: ${APP_PREVIOUS_KEYS:-}
      RUN_MIGRATIONS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan about > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-trading_bot}
      POSTGRES_USER: ${DB_USERNAME:-trading_bot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-trading_bot} -d ${DB_DATABASE:-trading_bot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: app
    image: trading-bot-app
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "horizon"]
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-trading_bot}
      DB_USERNAME: ${DB_USERNAME:-trading_bot}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      TRADING_LIVE_ENABLED: ${TRADING_LIVE_ENABLED:-false}
      RUN_MIGRATIONS: "false"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -q running"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: app
    image: trading-bot-app
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-trading_bot}
      DB_USERNAME: ${DB_USERNAME:-trading_bot}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      TRADING_LIVE_ENABLED: ${TRADING_LIVE_ENABLED:-false}
      RUN_MIGRATIONS: "false"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan schedule:work' > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    image: trading-bot-engine
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-}
      APP_PREVIOUS_KEYS: ${APP_PREVIOUS_KEYS:-}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-trading_bot}
      DB_USERNAME: ${DB_USERNAME:-trading_bot}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TRADING_LIVE_ENABLED: ${TRADING_LIVE_ENABLED:-false}
      TRADING_EXCHANGE_SANDBOX: ${TRADING_EXCHANGE_SANDBOX:-false}
      TRADING_TICK_INTERVAL: ${TRADING_TICK_INTERVAL:-60}
      TRADING_ORDER_SYNC_SECONDS: ${TRADING_ORDER_SYNC_SECONDS:-5}
      ENGINE_MARKET_DATA_WS_URL: ${ENGINE_MARKET_DATA_WS_URL:-wss://stream.binance.com:9443/ws}
      ENGINE_MARKET_DATA_REST_URL: ${ENGINE_MARKET_DATA_REST_URL:-https://api.binance.com}
      ENGINE_MARKET_DATA_SYMBOLS: ${ENGINE_MARKET_DATA_SYMBOLS:-}
      ENGINE_MARKET_DATA_STALE_AFTER: ${ENGINE_MARKET_DATA_STALE_AFTER:-}
      ENGINE_EXCHANGE_BASE_URL: ${ENGINE_EXCHANGE_BASE_URL:-}
      ENGINE_INTERNAL_TOKEN: ${ENGINE_INTERNAL_TOKEN:-}
      ENGINE_LISTEN_ADDR: ":8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/engine", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  postgres-data:
  redis-data:
